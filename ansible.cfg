# Settings for every playbook Packer and the tests run. The build scripts point
# ANSIBLE_CONFIG here, so the playbooks behave the same from any directory.
[defaults]
collections_path = ./.ansible/collections
roles_path = ./.cache/roles
retry_files_enabled = false
callback_result_format = yaml
interpreter_python = auto_silent
# Every build and test VM is new, with new host keys, and is only ever reached
# on 127.0.0.1 through a forwarded port.
host_key_checking = false

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes
