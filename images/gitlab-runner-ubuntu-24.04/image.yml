---
# GitLab Runner, on the hardened ubuntu-24.04 image.
#
# A role image: it starts from its base's finished disk, so it keeps the
# base's hardening and takes its audit content and exceptions, and adds the
# tools listed here from tools/tools.yml.

name: gitlab-runner-ubuntu-24.04
description: GitLab Runner, on the hardened ubuntu-24.04 image
family: linux
base: ubuntu-24.04
notes:
  - >-
    GitLab Runner is at /usr/local/bin/gitlab-runner, with no account,
    service, configuration or registration in the image. With the instance
    executor, a runner manager elsewhere starts VMs from the image through a
    fleeting plugin, such as GitLab's for Azure virtual machine scale sets,
    and runs each job on one over SSH as the user its connector_config
    names; the binary handles the job's artifacts and cache. Keep the manager
    on the image's GitLab Runner version, which native steps need. The
    hardening sets sshd's MaxSessions to 8, and the instance executor needs
    twice capacity_per_instance, so set that to 4 at most.
  - >-
    With the shell executor instead, a deployment makes an account and runs
    the runner on the VM as that account, for example from cloud-init:
    `gitlab-runner run-single --url <GitLab> --token <glrt-...> --executor
    shell --max-builds 1` takes one job and exits, as the container images'
    gitlab-runner does. Jobs run as that account and can read its token, so
    use one runner per trust boundary.
  - >-
    Podman, with the docker command, comes from the base image.

tools:
  - gitlab-runner
  - git
  - jq
  - python
  - uv
  - azure-cli
  - ldo-cli
  - ansible
  - tenv
  - terraform
  - powershell
  - libredevopshelpers
  - podman-compose
