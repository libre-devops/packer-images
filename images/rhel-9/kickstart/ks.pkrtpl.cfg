# Kickstart for the rhel-9 image's QEMU target, installing AlmaLinux 9 from the
# minimal ISO. Packer renders it from qemu.pkr.hcl onto a disc labelled
# OEMDRV, where Anaconda finds it. Everything that varies is a Packer
# variable. The install is deliberately plain: Ansible does the configuration.

text
cdrom
firstboot --disable
reboot --eject

lang ${locale}
keyboard --xlayouts='${keyboard}'
timezone ${timezone} --utc
network --bootproto=dhcp --device=link --activate --onboot=on --hostname=${hostname}
selinux --enforcing
firewall --enabled --ssh
services --enabled=sshd

# The build account: the per-build SSH key for Packer and a random password
# for sudo. The finalise script deletes it. Root has no password.
rootpw --lock
user --name=${username} --groups=wheel --password=${password} --plaintext
sshkey --username=${username} "${ssh_public_key}"

# UEFI and LVM, with a volume for each path CIS asks to be its own partition.
# The sizes add up to about 30 GB of the 32 GB disk, leaving free space in the
# volume group for lvextend. No swap.
zerombr
clearpart --all --initlabel --disklabel=gpt
part /boot/efi --fstype=efi --size=512
part /boot --fstype=xfs --size=1024
part pv.01 --fstype=lvmpv --size=1 --grow
volgroup vg0 pv.01
logvol / --vgname=vg0 --name=root --fstype=xfs --size=12288
logvol /home --vgname=vg0 --name=home --fstype=xfs --size=2048
logvol /tmp --vgname=vg0 --name=tmp --fstype=xfs --size=2048
logvol /var --vgname=vg0 --name=var --fstype=xfs --size=6144
logvol /var/tmp --vgname=vg0 --name=var_tmp --fstype=xfs --size=2048
logvol /var/log --vgname=vg0 --name=var_log --fstype=xfs --size=3072
logvol /var/log/audit --vgname=vg0 --name=var_log_audit --fstype=xfs --size=2048
bootloader --timeout=1

%packages
@^minimal-environment
%end

# A VM image has no use for crash kernel memory.
%addon com_redhat_kdump --disable
%end
