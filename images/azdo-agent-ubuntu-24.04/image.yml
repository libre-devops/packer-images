---
# Azure DevOps scale set agent, on the hardened ubuntu-24.04 image.
#
# A role image: it starts from its base's finished disk, so it keeps the
# base's hardening and takes its audit content and exceptions, and adds the
# tools listed here from tools/tools.yml. Adding a tool is a name here, and an
# entry in the catalogue if it is not there yet.

name: azdo-agent-ubuntu-24.04
description: Azure DevOps scale set agent, on the hardened ubuntu-24.04 image
family: linux
base: ubuntu-24.04
notes:
  - >-
    Azure DevOps installs the Azure Pipelines agent itself when it adds a VM to
    a scale set pool, as Microsoft advises, so the image does not. It has the
    libraries the agent needs and the tools pipelines use. The shared tool
    cache at /opt/hostedtoolcache is writable by the AzDevOps account that
    Azure DevOps makes, and by no one else. Podman, with the
    docker command, comes from the base image.

tools:
  - runner-libraries
  - hosted-toolcache
  - git
  - jq
  - python
  - uv
  - azure-cli
  - ansible
  - tenv
  - terraform
  - podman-compose
