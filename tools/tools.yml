---
# The tools role images install, each defined once. A role image lists the
# ones it wants by name under `tools` in its image.yml, and gets what they
# require with them.
#
# Renovate bumps the lines marked `renovate:`. Then run `just pin-tools` on its
# branch, which writes each download's SHA-256 here, once it matches what the
# vendor publishes (checksums, their signature where the vendor signs them,
# GitHub's digest, the PowerShell Gallery's hash), and each Python tool's
# hash-locked requirements to tools/locks/. A build installs nothing that
# does not match its pin.
#
# Every tool has a method, an Ansible task file in ansible/tools/:
#   package   packages from the base image's own signed repositories (on
#             Debian without recommends, so list what the tool needs), upgraded
#             at every build, so the OS vendor patches them
#   archive   a release archive, checked against its pinned SHA-256; the
#             binaries named in `files` go to /usr/local/bin, or with
#             `extract_to` the whole archive goes under /opt and `links`
#             link commands from it into /usr/local/bin
#   binary    a single release binary, checked against its pinned SHA-256,
#             installed as `command` in /usr/local/bin
#   python    a Python application in its own virtual environment under /opt,
#             installed by uv from hash-locked requirements, with no pip in it;
#             `with` adds packages to the same environment, each pinned, and
#             `commands` go to /usr/local/bin
#   tenv      a Terraform version installed through tenv, which checks
#             HashiCorp's signature with the key pinned in keys/hashicorp.asc
#   psmodule  a PowerShell module from the PowerShell Gallery, checked against
#             its pinned SHA-256, installed for every user
#   directory a directory a group shares, such as the tool cache, owned by
#             root and the group, which members alone can write to
#
# `check` runs as an unprivileged user in the test, and its output must
# contain the pinned version and everything under `expect`. `environment` goes to /etc/environment, which
# Azure DevOps scale set agents read.

tools:
  # What .NET applications need at run time: the Azure Pipelines agent, the
  # GitHub Actions runner and PowerShell. Azure DevOps installs its agent
  # itself when it adds a VM to the pool, so the image does not.
  dotnet-libraries:
    method: package
    description: Libraries .NET applications need (ICU, Kerberos, OpenSSL, zlib), for the CI agents and PowerShell
    packages:
      Debian: [libicu74, libkrb5-3, libssl3t64, zlib1g]
      RedHat: [libicu, krb5-libs, openssl-libs, zlib]

  # Rootless: CI agents run as an unprivileged user. Its overlay storage
  # driver needs the overlay module, which the golden images keep loadable
  # (EX-002). podman-docker adds the docker command for pipelines and tasks
  # that call it.
  podman:
    method: package
    description: Podman, with the docker command
    packages:
      # Debian installs without recommends, so these are what rootless use
      # needs: subordinate IDs (uidmap), networking (slirp4netns), an init
      # for --init (catatonit) and a user session bus for cgroups.
      Debian: [podman, podman-docker, uidmap, slirp4netns, catatonit, dbus-user-session]
      RedHat: [podman, podman-docker]
    configure:
      # Stops the docker command printing a notice every time, which breaks
      # scripts that read its output.
      /etc/containers/nodocker: ""
      # Short names, such as `docker pull alpine`, resolve to Docker Hub only,
      # as with Docker. With one search registry, a short name can never
      # resolve to a lookalike image on another registry.
      /etc/containers/registries.conf.d/50-image-search.conf: |
        unqualified-search-registries = ["docker.io"]
    # Runs the VM's own /bin/true in a container, on an overlay of /usr, which
    # needs user namespaces, subordinate IDs, the overlay module, SELinux or
    # AppArmor and seccomp to allow it, but no registry. Not / itself:
    # overlayfs refuses a lower layer that contains its upper one, which
    # lives in the user's home.
    check:
      - podman info
      - podman run --rm --network none --rootfs /usr:O /bin/true
    expect: "graphDriverName: overlay"

  podman-compose:
    method: python
    description: podman-compose, for Compose files, also as `docker compose`
    requires: [python, uv, podman]
    package: podman-compose
    # renovate: datasource=pypi depName=podman-compose
    version: 1.6.0
    commands: [podman-compose]
    check: podman-compose version

  # The GitHub Actions self-hosted runner, unpacked root-owned and read-only.
  # It writes its registration and logs into its own folder, so at deployment
  # a VM copies it into the runner user's home and registers there (see the
  # gh-runner images' notes). The image pins it, so register with
  # --disableupdate: Renovate bumps it, and GitHub stops queueing jobs for a
  # runner that misses an update for 30 days.
  actions-runner:
    method: archive
    description: GitHub Actions runner, at /opt/actions-runner
    requires: [dotnet-libraries, git]
    # renovate: datasource=github-releases depName=actions/runner extractVersion=^v(?<version>.+)$
    version: 2.338.2
    url: https://github.com/actions/runner/releases/download/v{version}/actions-runner-linux-x64-{version}.tar.gz
    release_notes_sha256: linux-x64
    sha256: "baebf204307bac6193480852732f0aba2ae97b6c5597c244f4d5558390147c40"  # 2.338.2
    extract_to: /opt/actions-runner
    # As a deployment runs it: copied into the user's home, since it writes
    # into its own folder even to print its version.
    check: >-
      sh -c 'cp -r /opt/actions-runner "$HOME/actions-runner" &&
      "$HOME/actions-runner/bin/Runner.Listener" --version'

  # GitLab Runner, which these images never run or register themselves. With
  # the instance executor, a runner manager elsewhere starts VMs from the
  # image and runs each job on one over SSH, and this binary handles the
  # job's artifacts and cache; it must match the manager's version for native
  # steps. With the shell executor, a deployment runs it on the VM (see the
  # gitlab-runner images' notes). GitLab signs each release's checksums.
  gitlab-runner:
    method: binary
    description: GitLab Runner, for the instance executor's job VMs or the shell executor
    requires: [git]
    # renovate: datasource=gitlab-releases depName=gitlab-org/gitlab-runner extractVersion=^v(?<version>.+)$
    version: 19.5.3
    url: https://gitlab-runner-downloads.s3.amazonaws.com/v{version}/binaries/gitlab-runner-linux-amd64
    checksums: https://gitlab-runner-downloads.s3.amazonaws.com/v{version}/release.sha256
    signature: https://gitlab-runner-downloads.s3.amazonaws.com/v{version}/release.sha256.asc
    # GitLab's package signing key. GitLab extends its expiry in place, so
    # it is fetched when pinning and trusted only by this fingerprint.
    signing_key: https://packages.gitlab.com/runner/gitlab-runner/gpgkey/runner-gitlab-runner-49F16C5CC3A0F81F.pub.gpg
    fingerprint: 931DA69CFA3AFEBBC97DAA8C6C57C29C6BA75A4E
    sha256: "cd586a217b0ba4d339b3f3d645b84f8f5e1cc711e73148c30a3eec0f8c78378b"  # 19.5.3
    command: gitlab-runner
    check: gitlab-runner --version

  acl:
    method: package
    description: POSIX ACL tools (setfacl, getfacl)
    packages:
      Debian: [acl]
      RedHat: [acl]

  # The tool cache the pipelines' setup tasks share (setup-python and the
  # like on GitHub, UsePythonVersion on Azure DevOps), at the path Microsoft's
  # hosted runners use. Not world-writable, as on those: only members of the
  # toolcache group can write to it, and everyone can read. The members are
  # listed by name, so the account that runs jobs is one as soon as it
  # exists: AzDevOps, which Azure DevOps makes when it adds a VM to a pool,
  # and runner, which the gh-runner images' deployment makes.
  hosted-toolcache:
    method: directory
    description: Shared tool cache at /opt/hostedtoolcache, writable by the toolcache group only
    requires: [acl]
    path: /opt/hostedtoolcache
    group: toolcache
    members: [AzDevOps, runner]
    environment:
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
      AGENT_TOOLSDIRECTORY: /opt/hostedtoolcache
    # The test user is not a member, so it must not be able to write.
    check:
      - stat -c '%U %G %a' /opt/hostedtoolcache
      - getfacl --omit-header --absolute-names /opt/hostedtoolcache
      - getent group toolcache
      - sh -c '! touch /opt/hostedtoolcache/not-a-member 2>/dev/null'
    expect:
      - root toolcache 2775
      - "default:group::rwx"
      - "default:other::r-x"
      - ":AzDevOps,runner"

  git:
    method: package
    description: Git
    packages:
      Debian: [git]
      RedHat: [git]
    # And SSH out, which git uses for Azure Repos and GitHub: ssh-keyscan
    # fails, with no output, unless it reaches github.com on port 22.
    check:
      - git --version
      - ssh-keyscan -T 15 -t ed25519 github.com
    expect: "github.com ssh-ed25519"

  jq:
    method: package
    description: jq
    packages:
      Debian: [jq]
      RedHat: [jq]
    check: jq --version

  # The base image's own Python, so the OS vendor patches it. Ubuntu 24.04's
  # python3 is 3.12; RHEL 9 has 3.12 as a separate package. The python tools
  # below run on it. A tool that needs a newer Python means moving this to a
  # pinned uv-managed one.
  python:
    method: package
    description: Python 3.12, the base image's own
    packages:
      Debian: [python3, python3-venv]
      RedHat: [python3.12]
    interpreter: /usr/bin/python3.12
    check: python3.12 --version

  uv:
    method: archive
    description: uv, the Python package and project manager
    # renovate: datasource=github-releases depName=astral-sh/uv
    version: 0.13.7
    url: https://github.com/astral-sh/uv/releases/download/{version}/uv-x86_64-unknown-linux-gnu.tar.gz
    checksums: https://github.com/astral-sh/uv/releases/download/{version}/uv-x86_64-unknown-linux-gnu.tar.gz.sha256
    sha256: "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"  # 0.13.7
    files:
      uv: uv-x86_64-unknown-linux-gnu/uv
      uvx: uv-x86_64-unknown-linux-gnu/uvx
    check: uv --version

  azure-cli:
    method: python
    description: Azure CLI
    requires: [python, uv]
    package: azure-cli
    # renovate: datasource=pypi depName=azure-cli
    version: 2.92.0
    # The az script pip installs finds Python on PATH, so the image runs the
    # module with its own environment's Python instead.
    modules:
      az: azure.cli
    environment:
      AZURE_CORE_COLLECT_TELEMETRY: "false"
    check: az version

  ansible:
    method: python
    description: Ansible, with the community collections, and Molecule with its podman driver
    requires: [python, uv]
    package: ansible
    # renovate: datasource=pypi depName=ansible
    version: 15.0.0
    # In Ansible's own environment, so Molecule runs this ansible-core and
    # these collections (containers.podman for the podman driver).
    with:
      # renovate: datasource=pypi depName=molecule
      molecule: 26.11.0
      # renovate: datasource=pypi depName=molecule-plugins
      molecule-plugins: 26.11.0
    commands:
      - ansible
      - ansible-community
      - ansible-config
      - ansible-console
      - ansible-doc
      - ansible-galaxy
      - ansible-inventory
      - ansible-playbook
      - ansible-pull
      - ansible-test
      - ansible-vault
      - molecule
    # Making a scenario runs a playbook on localhost, so it proves Molecule
    # and Ansible both work for an ordinary user, without the network.
    check:
      - ansible-community --version
      - molecule drivers
      - sh -c 'cd "$(mktemp -d)" && molecule init scenario && test -s molecule/default/molecule.yml'
    expect: podman

  tenv:
    method: archive
    description: tenv, the Terraform and OpenTofu version manager
    # renovate: datasource=github-releases depName=tofuutils/tenv extractVersion=^v(?<version>.+)$
    version: 4.15.1
    url: https://github.com/tofuutils/tenv/releases/download/v{version}/tenv_v{version}_Linux_x86_64.tar.gz
    checksums: https://github.com/tofuutils/tenv/releases/download/v{version}/tenv_v{version}_checksums.txt
    sha256: "0d931096eefb9d9147bc23f3f29f9bf302a2ee8d3455a86d0171787a7b06bce6"  # 4.15.1
    # tenv's terraform proxy runs whichever version a project asks for
    # (.terraform-version, required_version), or the default below.
    files:
      tenv: tenv
      terraform: terraform
    # HashiCorp's release key, which this repository already pins, so tenv
    # does not fetch it from hashicorp.com for every install.
    repo_files:
      /usr/local/share/keyrings/hashicorp.asc: keys/hashicorp.asc
    environment:
      TENV_ROOT: /opt/tenv
      # Never install a version at job time: a pipeline that needs another
      # one installs it with `tenv tf install`, which checks the signature.
      TENV_AUTO_INSTALL: "false"
      TFENV_HASHICORP_PGP_KEY: /usr/local/share/keyrings/hashicorp.asc
    check: tenv --version

  # PowerShell 7, the LTS line: Renovate stays on 7.6 (renovate.json), and
  # moving to the next LTS is done by hand. From Microsoft's release archive
  # rather than its apt and dnf repositories, so the version is the pinned
  # one on both families. pwsh runs from its own folder, beside the rest of
  # .NET, so it is linked rather than copied.
  powershell:
    method: archive
    description: PowerShell 7 (LTS)
    requires: [dotnet-libraries]
    # renovate: datasource=github-releases depName=PowerShell/PowerShell extractVersion=^v(?<version>.+)$
    version: 7.6.10
    url: https://github.com/PowerShell/PowerShell/releases/download/v{version}/powershell-{version}-linux-x64.tar.gz
    checksums: https://github.com/PowerShell/PowerShell/releases/download/v{version}/hashes.sha256
    sha256: "e261cabc91c78a9afe8d1e5f24731ab0d38204735ab2ec94b0af55102652e10d"  # 7.6.10
    extract_to: /opt/microsoft/powershell/7
    links:
      pwsh: pwsh
    environment:
      POWERSHELL_TELEMETRY_OPTOUT: "1"
      POWERSHELL_UPDATECHECK: "Off"
    check: pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

  # Libre DevOps' PowerShell helpers, for every user.
  libredevopshelpers:
    method: psmodule
    description: LibreDevOpsHelpers, the Libre DevOps PowerShell module
    requires: [powershell]
    module: LibreDevOpsHelpers
    # renovate: datasource=nuget depName=LibreDevOpsHelpers registryUrl=https://www.powershellgallery.com/api/v2/
    version: 3.0.1
    sha256: "0320cd7f508a6b9ca56cc3c6eb59e830586cfa3e640a327c55745d04dc2def78"  # 3.0.1
    check: pwsh -NoLogo -NoProfile -Command 'Import-Module LibreDevOpsHelpers; (Get-Module LibreDevOpsHelpers).Version.ToString()'

  # ldo, Libre DevOps' Python helpers CLI, published as libre-devops-helpers.
  ldo-cli:
    method: python
    description: ldo, the Libre DevOps helpers CLI (libre-devops-helpers)
    requires: [python, uv]
    package: libre-devops-helpers
    # renovate: datasource=pypi depName=libre-devops-helpers
    version: 0.8.1
    commands: [ldo]
    check: ldo --version

  terraform:
    method: tenv
    description: Terraform, the default version for tenv
    requires: [tenv]
    tenv: tf
    # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
    version: 1.17.1
    environment:
      CHECKPOINT_DISABLE: "1"
    check: terraform version
