---
name: gh-runner-rhel-9

# This image's pipeline: on a change to anything it is built from, its base
# image included, weekly so it picks up security updates, and by hand. It
# builds its base, rhel-9, first, in the same job.

on:
  push:
    branches: [main]
    paths: &paths
      - images/gh-runner-rhel-9/**
      - images/rhel-9/**
      - tools/**
      - keys/**
      - ansible/**
      - scripts/**
      - exceptions.yml
      - ansible.cfg
      - requirements.yml
      - versions.yml
      - pyproject.toml
      - uv.lock
      - .github/workflows/image.yml
      - .github/workflows/gh-runner-rhel-9.yml
  pull_request:
    paths: *paths
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: gh-runner-rhel-9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qemu:
    name: QEMU
    permissions:
      contents: read
    # The self-repository form: always this commit's copy, never the checkout's.
    uses: $/.github/workflows/image.yml
    with:
      image: gh-runner-rhel-9
      base: rhel-9
      target: qemu
