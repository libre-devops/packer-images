---
name: rhel-9

# This image's pipeline: on a change to anything it is built from, weekly so
# it picks up security updates, and by hand.

on:
  push:
    branches: [main]
    paths: &paths
      - images/rhel-9/**
      - tools/**
      - ansible/**
      - scripts/**
      - exceptions.yml
      - ansible.cfg
      - requirements.yml
      - versions.yml
      - pyproject.toml
      - uv.lock
      - .github/workflows/image.yml
      - .github/workflows/rhel-9.yml
  pull_request:
    paths: *paths
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: rhel-9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qemu:
    name: QEMU
    permissions:
      contents: read
    # The self-repository form: always this commit's copy, never the checkout's.
    uses: $/.github/workflows/image.yml
    with:
      image: rhel-9
      target: qemu
