---
name: CI

# Pull requests and main: scan for secrets, lint, and validate every image
# definition, hardening profile and Packer template. Building and testing an
# image is that image's own workflow. Each job calls the same just recipe a
# local run would.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # From the release's checksums file. Renovate cannot update a pinned download,
  # so bump both together when moving to a new gitleaks release.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  JUST_VERSION: 1.59.0

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, so a secret added and later removed is still found.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'

  lint:
    name: Lint and validate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install the pinned Packer
        run: uvx --from "rust-just==${JUST_VERSION}" just tools

      - name: Lint
        run: uvx --from "rust-just==${JUST_VERSION}" just lint

      - name: Validate
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: uvx --from "rust-just==${JUST_VERSION}" just validate
