---
name: ubuntu-24.04

# This image's pipeline: on a change to anything it is built from, weekly so
# it picks up security updates, and by hand.

on:
  push:
    branches: [main]
    paths: &paths
      - images/ubuntu-24.04/**
      - ansible/**
      - scripts/**
      - exceptions.yml
      - ansible.cfg
      - requirements.yml
      - versions.yml
      - pyproject.toml
      - uv.lock
      - .github/workflows/image.yml
      - .github/workflows/ubuntu-24.04.yml
  pull_request:
    paths: *paths
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ubuntu-24.04-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qemu:
    name: QEMU
    permissions:
      contents: read
    # The self-repository form: always this commit's copy, never the checkout's.
    uses: $/.github/workflows/image.yml
    with:
      image: ubuntu-24.04
      target: qemu
