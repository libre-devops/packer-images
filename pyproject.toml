# Development and build tools only. The images themselves have no Python dependencies.
[project]
name = "packer-images"
version = "0.0.0"
description = "Build tools for the Libre DevOps Packer images"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "ansible-core>=2.21,<2.23",
  "ansible-lint>=26.10,<27",
  "pyyaml>=6.0,<7",
  "yamllint>=1.38,<2",
  "zizmor>=1.16,<2",
]

[tool.uv]
package = false
default-groups = ["dev"]

# Only resolve releases at least a week old, so a freshly published bad release is not picked up.
exclude-newer = "7 days"
